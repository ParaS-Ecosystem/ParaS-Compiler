name: ParaS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build ParaS Compiler
    runs-on: ubuntu-24.04

    env:
      CC: /usr/bin/clang-21
      CXX: /usr/bin/clang++-21
      CPLUS_INCLUDE_PATH: /usr/include/c++/14:/usr/include/x86_64-linux-gnu/c++/14:/usr/include
      C_INCLUDE_PATH: /usr/include
      LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/14:/usr/lib/x86_64-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add LLVM 21 repository
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            gfortran \
            libstdc++-14-dev \
            cmake \
            ninja-build \
            git \
            llvm-21 \
            llvm-21-dev \
            llvm-21-tools \
            clang-21 \
            clang-tools-21 \
            libclang-21-dev \
            libffi-dev \
            libedit-dev \
            libncurses-dev \
            libcurl4-openssl-dev \
            zlib1g-dev \
            libxml2-dev \
            libzstd-dev

      - name: Verify toolchain
        run: |
          /usr/bin/clang-21 --version
          /usr/bin/clang++-21 --version
          llvm-config-21 --version
          g++-14 --version
          ls /usr/include/c++/14/type_traits
          ls /usr/include/c++/14/cstdlib

      - name: Configure ParaS
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=/usr/bin/clang-21 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-21 \
            -DPARAS_BASE_COMPILER=/usr/bin/clang++-21 \
            -DPARAS_INSTALL_PREFIX=$HOME/paras-install \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-21/lib/cmake/clang \
            -DCMAKE_PREFIX_PATH=/usr/lib/llvm-21 \
            -DCMAKE_CXX_STANDARD=20

      - name: Build ParaS
        run: |
          cmake --build build --parallel $(nproc)

      - name: Install ParaS
        run: |
          cmake --install build

      - name: Verify installation
        run: |
          ls -R $HOME/paras-install

          if [ -f "$HOME/paras-install/bin/parascc" ]; then
            chmod +x $HOME/paras-install/bin/parascc
            $HOME/paras-install/bin/parascc --version || true
            $HOME/paras-install/bin/parascc --help || true
          else
            echo "ERROR: parascc not found!"
            exit 1
          fi